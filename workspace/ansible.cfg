# Run all Ansible commands from the recon node (make shell), inside this
# workspace/ directory. The connection defaults below are already wired for the
# fleet — you only need to build the inventory that lists the hosts.
[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
remote_user = cadet
private_key_file = /home/cadet/.ssh/cadet_key
deprecation_warnings = False
interpreter_python = auto_silent

[inventory]
# community.general.nmap powers the dynamic-inventory capstone (Phase 5).
enable_plugins = community.general.nmap, ini, yaml, auto, host_list, script

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
